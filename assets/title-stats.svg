<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f05cf0"/>
      <stop offset="1" stop-color="#5ee6f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.2 0;0.2 0;-0.2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .bar { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; transform-origin: 0 0; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>
  <g transform="skewX(-14) translate(14 0)">
    <rect x="4" y="12" width="10" height="30" fill="#5ee6f7"/>
    <rect x="20" y="12" width="5" height="30" fill="#5ee6f7" opacity="0.5"/>
  </g>
  <text x="44" y="38" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-weight="800" font-style="italic" font-size="26" fill="url(#t)" letter-spacing="1">STATS</text>
  <rect class="bar" x="44" y="48" width="1140" height="2" fill="url(#t)" opacity="0.5"/>
</svg>
