<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 186" width="590" height="186">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151231"/>
      <stop offset="1" stop-color="#0d0b1e"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="186">
      <stop offset="0" stop-color="#f05cf0"/>
      <stop offset="0.5" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#5ee6f7"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="#8f8cff" fill-opacity="0.18"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="588" height="184" rx="14"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      .run { stroke-dasharray: 160 1552; animation: run 5s linear infinite; animation-delay: 1.8s; }
      .in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: 0.27s; }
      @keyframes run { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1552 } }
      @keyframes in { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: translateX(0) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="184" rx="14" fill="url(#bg)" stroke="#2c2756" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <polygon points="420,0 590,0 590,186 260,186" fill="url(#dots)"/>
    <line x1="260" y1="186" x2="420" y2="0" stroke="#f05cf0" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="290" y1="186" x2="450" y2="0" stroke="#5ee6f7" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <rect class="run" x="1" y="1" width="588" height="184" rx="14" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#blur)"/>
  <rect class="run" x="1" y="1" width="588" height="184" rx="14" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g class="in">
    <rect x="0" y="0" width="5" height="26" fill="#5ee6f7" transform="translate(30 26) skewX(-14)"/>
    <text x="44" y="47" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-weight="800" font-style="italic" font-size="27" fill="#ffffff">WFHelper</text>
    <text x="26" y="84" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e6e3ff" fill-opacity="0.85">Desktop Warframe companion: inventory, relic reward</text><text x="26" y="107" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e6e3ff" fill-opacity="0.85">scanner, warframe.market prices, mastery, foundry and</text><text x="26" y="130" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e6e3ff" fill-opacity="0.85">world state.</text>
    <circle cx="32" cy="162" r="6" fill="#3178c6"/>
    <text x="44" y="167" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9d97c9">TypeScript</text>
    <text x="564" y="167" text-anchor="end" font-family="'Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#5ee6f7" letter-spacing="1">SVELTE · DESKTOP</text>
  </g>
</svg>
